{{/* The bank's part of a line's stats page. */}}
{{define "content"}}{{$L := .L}}
<figure class="chart">
  <figcaption>{{$L.T "import.line_stores"}}{{if .Store}} <a class="hint" href="{{.NoStoreURL}}">{{$L.T "import.filter_clear"}}</a>{{end}}</figcaption>
  <div class="scroll">
  <table class="stats-table">
    <tr class="head"><th>{{$L.T "import.store"}}</th><th class="num">{{$L.T "import.receipts_count"}}</th><th class="num">{{$L.T "import.amount"}}</th><th>{{$L.T "import.months"}}</th></tr>
    {{range .Stores}}<tr{{if eq .Name $.Store}} class="chosen"{{end}}><th><a href="{{call $.StoreURL .Name}}">{{.Name}}</a></th><td class="num">{{.Count}}</td><td class="num">{{$L.Money .Amount}}</td><td class="months">{{template "import-months" .}}</td></tr>{{end}}
  </table>
  </div>
</figure>
<figure class="chart" id="receipt-items">
  <figcaption>{{$L.T "import.line_items"}}{{if .Query}} <a class="hint" href="{{.NoQueryURL}}">{{$L.T "import.search_clear"}}</a>{{end}}</figcaption>
  <form class="filters receipt-search" action="/stats/line#receipt-items" role="search">
    {{if not .Current.IsDefault}}<input type="hidden" name="budget" value="{{.Current.Slug}}">{{end}}
    <input type="hidden" name="section" value="{{.Section}}">
    {{range .Names}}<input type="hidden" name="name" value="{{.}}">{{end}}
    <input type="hidden" name="from" value="{{.From}}"><input type="hidden" name="to" value="{{.To}}">
    {{with .Store}}<input type="hidden" name="store" value="{{.}}">{{end}}
    <input type="search" name="q" value="{{.Query}}" placeholder="{{$L.T "import.search_placeholder"}}" aria-label="{{$L.T "import.search"}}" autocomplete="off">
    <button class="secondary">{{$L.T "import.search"}}</button>
  </form>
  {{if .Query}}
  {{if .Found}}
  <p class="hint">{{if .More}}{{$L.T "import.search_more" .Max}}{{else}}{{$L.T "import.search_count" (len .Found)}}{{end}}</p>
  <div class="scroll">
  <table class="stats-table">
    <tr class="head"><th>{{$L.T "import.date"}}</th><th>{{$L.T "import.item"}}</th><th>{{$L.T "import.store"}}</th><th class="num">{{$L.T "import.amount"}}</th></tr>
    {{range .Found}}<tr><th><a href="{{.URL}}">{{.Booked.Format "2006-01-02"}}</a></th><td>{{.Name}}</td><td>{{.Store}}</td><td class="num">{{$L.Money .Amount}}</td></tr>{{end}}
  </table>
  </div>
  {{else}}
  <p class="hint">{{$L.T "import.search_none" .Query}}</p>
  {{end}}
  {{else}}
  <div class="scroll">
  <table class="stats-table">
    <tr class="head"><th>{{$L.T "import.item"}}</th><th class="num">{{$L.T "import.times"}}</th><th class="num">{{$L.T "import.amount"}}</th><th>{{$L.T "import.months"}}</th></tr>
    {{range .Items}}<tr><th>{{.Name}}</th><td class="num">{{.Count}}</td><td class="num">{{$L.Money .Amount}}</td><td class="months">{{template "import-months" .}}</td></tr>{{end}}
  </table>
  </div>
  {{end}}
  <p class="hint">{{$L.T "import.line_receipts_hint"}}</p>
</figure>
{{end}}

{{/* The months a row was bought in, each opening the line's month. */}}
{{define "import-months"}}{{range $i, $m := .Months}}{{if $i}} · {{end}}<a href="{{$m.URL}}">{{$m.Label}}</a>{{end}}{{with .More}} <span class="hint">{{.}}</span>{{end}}{{end}}
