{{define "layout"}}<!doctype html>
<html lang="{{.L.Code}}"{{with .User}}{{with .Theme}} data-theme="{{.}}"{{end}}{{end}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Ledger</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{asset "style.css"}}">
<script src="{{asset "app.js"}}" defer></script>
</head>
<body data-decimal="{{.L.Decimal}}" data-thousands="{{.L.Thousands}}">
<header>
  <a class="brand" href="/"><img src="/static/logo.svg" alt="" width="26" height="26">Ledger</a>
  {{if .User}}
  <nav>
    {{range .Nav}}<a href="{{.Path}}"{{if hasPrefix $.Path .Path}} class="active"{{end}}>{{$.L.T .Label}}</a>{{end}}
  </nav>
  <form method="post" action="/theme">
    <button class="icon theme" name="theme" value="dark" title="{{.L.T "theme.toggle"}}" aria-label="{{.L.T "theme.toggle"}}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
    </button>
  </form>
  <a href="/settings" class="icon settings{{if eq .Path "/settings"}} active{{end}}" title="{{.L.T "nav.settings"}}" aria-label="{{.L.T "nav.settings"}}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </a>
  {{if .LoginEnabled}}
  <form method="post" action="/logout">
    <button class="link">{{.L.T "nav.logout"}}</button>
  </form>
  {{end}}
  {{end}}
</header>
<main>{{template "content" .}}</main>
</body>
</html>{{end}}
