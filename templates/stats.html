{{define "content"}}{{$L := .L}}
<h1>{{.Title}}</h1>

{{if .AllYears}}
<form class="filters" action="/stats">
  {{- template "budget-picker" .}}
  <label>{{$L.T "stats.from"}}
    <select name="from" data-autosubmit autocomplete="off">{{range .AllYears}}<option{{if eq . $.From}} selected{{end}}>{{.}}</option>{{end}}</select>
  </label>
  <label>{{$L.T "stats.to"}}
    <select name="to" data-autosubmit autocomplete="off">{{range .AllYears}}<option{{if eq . $.To}} selected{{end}}>{{.}}</option>{{end}}</select>
  </label>
  <noscript><button class="secondary">{{$L.T "budget.go"}}</button></noscript>
</form>
{{end}}

{{if not .Years}}
<p class="hint">{{$L.T "stats.empty"}}</p>
{{else}}
<div class="stats">
  <figure class="chart">
    <figcaption>{{$L.T "stats.chart"}}</figcaption>
    <div class="legend">
      <span><i class="swatch income"></i>{{$L.T "section.income"}}</span>
      <span><i class="swatch expense"></i>{{$L.T "section.expense"}}</span>
      <span><i class="swatch allocation"></i>{{$L.T "section.allocation"}}</span>
      <span><i class="swatch unallocated"></i>{{$L.T "calc.difference"}}</span>
    </div>
    <div data-chart="years" data-income="{{$L.T "section.income"}}" data-expense="{{$L.T "section.expense"}}" data-net="{{$L.T "calc.net"}}" data-allocation="{{$L.T "section.allocation"}}" data-difference="{{$L.T "calc.difference"}}"></div>
    <script type="application/json" id="stats-data">{{.Chart}}</script>
  </figure>

  <figure class="chart">
    <figcaption>{{$L.T "stats.totals"}}</figcaption>
    <label class="toggle"><input type="checkbox"{{if $.User.StatsChanges}} checked{{end}} autocomplete="off"> {{$L.T "stats.changes"}}</label>
    <div class="scroll">
    <table class="stats-table">
      <tr class="head">
        <th>{{$L.T "budget.year"}}</th>
        <th>{{$L.T "section.income"}}</th><th class="change"></th>
        <th>{{$L.T "section.expense"}}</th><th class="change"></th><th class="share">{{$L.T "stats.of_income"}}</th>
        <th>{{$L.T "calc.net"}}</th><th class="change"></th>
        <th>{{$L.T "section.allocation"}}</th><th class="change"></th><th class="share">{{$L.T "stats.of_income"}}</th>
        <th>{{$L.T "calc.difference"}}</th><th class="change"></th>
      </tr>
      {{range .Years}}
      <tr>
        <th><a href="{{$.Base}}/{{.Year}}">{{.Year}}</a></th>
        <td class="num">{{$L.Money .Income}}</td><td class="delta change {{.IncomeDelta.Class}}">{{.IncomeDelta.Text}}</td>
        <td class="num">{{$L.Money .Expense}}</td><td class="delta change {{.ExpenseDelta.Class}}">{{.ExpenseDelta.Text}}</td><td class="share">{{.ExpenseShare}}</td>
        <td class="num">{{$L.Money .Net}}</td><td class="delta change {{.NetDelta.Class}}">{{.NetDelta.Text}}</td>
        <td class="num">{{$L.Money .Allocation}}</td><td class="delta change {{.AllocationDelta.Class}}">{{.AllocationDelta.Text}}</td><td class="share">{{.AllocationShare}}</td>
        <td class="num{{if gt .Difference 0}} pos{{else if lt .Difference 0}} neg{{end}}">{{$L.Money .Difference}}</td><td class="delta change {{.DifferenceDelta.Class}}">{{.DifferenceDelta.Text}}</td>
      </tr>
      {{end}}
    </table>
    </div>
    <p class="hint">{{$L.T "stats.delta_hint"}}</p>
  </figure>

  {{range .LineTables}}{{$key := .Key}}
  <figure class="chart">
    <figcaption>{{$L.T (print "stats.lines_" .Key)}}</figcaption>
    <form id="pick-{{$key}}" action="/stats/line" hidden>
      <input type="hidden" name="section" value="{{$key}}">
      <input type="hidden" name="from" value="{{$.From}}">
      <input type="hidden" name="to" value="{{$.To}}">
      {{if not $.Current.IsDefault}}<input type="hidden" name="budget" value="{{$.Current.Slug}}">{{end}}
    </form>
    <div class="toggles">
      <label class="toggle"><input type="checkbox"{{if $.User.StatsChanges}} checked{{end}} autocomplete="off"> {{$L.T "stats.changes"}}</label>
      <label class="toggle-all" hidden><input type="checkbox" data-pick-all autocomplete="off"> {{$L.T "stats.select_all"}}</label>
    </div>
    <div class="scroll">
    <table class="stats-table">
      <tr class="head">
        <th></th>
        {{range $.Years}}<th>{{.Year}}</th><th class="change"></th>{{end}}
      </tr>
      {{range .Lines}}
      <tr>
        <th><input type="checkbox" class="pick" name="name" value="{{.Name}}" form="pick-{{$key}}" autocomplete="off" aria-label="{{.Name}}"> <a href="/stats/line?section={{$key}}&name={{.Name}}&from={{$.From}}&to={{$.To}}{{if not $.Current.IsDefault}}&budget={{$.Current.Slug}}{{end}}">{{.Name}}</a></th>
        {{range .Cells}}<td class="num">{{if .Value}}{{$L.Money .Value}}{{else}}<span class="hint">–</span>{{end}}</td><td class="delta change {{.Delta.Class}}">{{.Delta.Text}}</td>{{end}}
      </tr>
      {{end}}
    </table>
    </div>
    <button class="secondary pick" form="pick-{{$key}}" data-pick>{{$L.T "stats.show_selected"}}</button>
    <p class="hint">{{$L.T "stats.delta_hint"}}</p>
  </figure>
  {{end}}
</div>
{{end}}
{{end}}
