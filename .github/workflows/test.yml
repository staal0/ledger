name: Go Test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # A throwaway MariaDB for the database tests (internal/app/testsupport.go).
    services:
      mariadb:
        image: mariadb:lts
        env:
          MARIADB_DATABASE: ledger_test
          MARIADB_USER: ledger
          MARIADB_PASSWORD: ledger
          MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      - name: go test
        env:
          LEDGER_TEST_DSN: ledger:ledger@tcp(127.0.0.1:3306)/ledger_test
        run: go test -v -cover ./...
