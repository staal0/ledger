name: Go format
on: [push, pull_request]

permissions:
  contents: read

jobs:
  gofmt:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      # Fail, rather than rewrite, when a file is not formatted.
      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -s -w on:"
            echo "$unformatted"
            exit 1
          fi
